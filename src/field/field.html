<section class="lab" aria-label="포켓몬 수집 필드">
  <header><div><span class="eyebrow">EXPLORE · CATCH · DISCOVER</span><h1>Pokémon Lab <small>수집 연구소</small></h1></div><div class="progress"><strong id="progress-count">0 / 1025</strong><span>나의 포켓몬 컬렉션</span><progress id="progress-bar" value="0" max="1025"></progress></div></header>
  <div class="field" id="field"><div id="map-background"></div><div class="landmark"><strong id="region-name">초원</strong><span id="region-summary"></span></div><div id="tracking-controls" hidden><span id="tracking-name"></span><button id="cancel-target" type="button">추적 취소</button></div>
<div id="creatures"></div><div id="particles" aria-hidden="true"></div><div id="projectile" aria-hidden="true"></div><div id="aim"></div><p id="notice" role="status">오늘은 어떤 포켓몬을 만날까요?</p></div>
  <button id="region-prev" class="region-arrow" aria-label="이전 지역">❮</button><button id="region-next" class="region-arrow" aria-label="다음 지역">❯</button>
  <footer><button id="professor" class="tool" aria-label="오박사 챗봇 열기"><span class="art"></span><strong>오박사 연구실</strong><small>무엇이든 물어보세요</small></button><button id="throw" class="tool ball" aria-label="몬스터볼 드래그해서 던지기"><span class="art"></span><strong>몬스터볼 던지기</strong><small>누르고 → 조준하고 → 놓기</small></button><button id="dex" class="tool" aria-label="포켓몬 도감 열기"><span class="art"></span><strong>포켓몬 도감</strong><small>모든 포켓몬을 살펴봐요</small></button></footer>
  <div id="dex-transition" class="rotom-overlay" hidden>
    <section id="rotom-stage" aria-label="로토무 도감" role="dialog" aria-modal="true" data-state="closed">
      <div id="rotom-flip"><div class="rotom-face rotom-front"><img src="app/static/rotom/closed.png" alt="닫힌 도감" draggable="false"></div>
      <div class="rotom-face rotom-back"><img class="rotom-frame" src="app/static/rotom/open.png" alt="열린 로토무 도감 프레임" draggable="false">
        <div id="rotom-screen"><div class="rotom-content">
          <div class="rotom-top"><strong>POKÉDEX</strong><span id="rotom-number"></span><button id="rotom-filters-toggle" aria-label="필터 열기">필터</button><button id="rotom-close" aria-label="도감 닫기">✕</button></div>
          <div class="rotom-search"><input id="rotom-query" aria-label="이름 또는 도감 번호 검색" placeholder="이름 / #번호" maxlength="80"><button id="rotom-list-tab">목록</button><button id="rotom-detail-tab">상세</button></div>
          <div id="rotom-filters"><select id="rotom-generation" aria-label="도감 세대"></select><select id="rotom-type" aria-label="도감 타입"></select><select id="rotom-owned" aria-label="수집 상태"><option>전체</option><option>수집</option><option>미수집</option></select></div>
          <div id="rotom-body"><nav id="rotom-list" aria-label="포켓몬 목록"></nav><article id="rotom-detail" aria-label="포켓몬 상세"></article></div>
          <div class="rotom-bottom"><button id="rotom-prev" aria-label="이전 목록 페이지">‹</button><span id="rotom-page"></span><button id="rotom-next" aria-label="다음 목록 페이지">›</button><button id="rotom-tools">연구 도구</button><span id="rotom-status" role="status"></span></div>
        </div></div>
      </div></div>
    </section>
  </div>
  <div id="capture-popup" role="dialog" aria-label="포획 성공 정보" aria-modal="true" hidden>
    <article class="capture-card"><div id="capture-message"></div><img id="capture-image" alt="포획한 포켓몬"><h2 id="capture-name"></h2><p id="capture-types"></p><p id="capture-stats"></p><p id="capture-record"></p><div class="popup-actions"><button id="capture-confirm">확인</button><button id="capture-dex">도감에서 보기</button></div></article>
  </div>
</section>
